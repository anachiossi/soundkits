<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Sound kit">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sound kit</title>
<style>
  
  :root { --ink: #0f172a; --soft: #475569; --line: #94a3b8; --paper: #fff; --go: #0f172a; --bad: #b91c1c; --step: #e2e8f0;
          --text: 21px; --big: 24px; --title: 38px; --gap: 16px; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 28px 16px 40px;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: var(--text); line-height: 1.4;
         color: var(--ink); background: var(--paper); }
  form { width: 100%; max-width: 440px; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); align-content: start; }
  input[type=password], button { width: 100%; min-width: 0; }
  h1 { margin: 0 0 4px; font-size: var(--title); line-height: 1.1; }
  p { margin: 0; }
  input[type=password] { font: inherit; font-size: var(--big); padding: 16px; border: 2px solid var(--line); border-radius: 12px; }
  label { display: flex; gap: 12px; align-items: center; }
  label input { width: 26px; height: 26px; }
  button { font: inherit; font-size: var(--big); font-weight: 800; padding: 18px; border: 0; border-radius: 12px;
           background: var(--go); color: var(--paper); }
  .bad { color: var(--bad); font-weight: 700; }
</style>
</head>
<body>
<form id="door">
  <h1>Sound kit</h1>
  <input type="password" id="password" autocomplete="current-password" placeholder="Password" required>
  <label><input type="checkbox" id="remember" checked> Remember on this phone</label>
  <button id="open">Open</button>
  <p id="message" aria-live="polite"></p>
</form>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => null);

const ROUNDS = 600000;
const KEPT = 'kit-key';
const message = document.getElementById('message');
const say = (text, bad) => { message.textContent = text; message.className = bad ? 'bad' : ''; };

async function lockedKit() {
  const answer = await fetch('kit.bin', { cache: 'no-cache' });
  if (!answer.ok) throw new Error('missing');
  return new Uint8Array(await answer.arrayBuffer());
}

async function keyFrom(password, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ROUNDS }, base,
    { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

async function unlock(bytes, key) {
  try {
    const page = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(16, 28) }, key, bytes.slice(28));
    return new TextDecoder().decode(page);
  } catch { return null; }
}

function show(page, key) {
  window.kitKey = key;
  document.open();
  document.write(page);
  document.close();
}

async function keptKey() {
  try {
    const kept = JSON.parse(localStorage.getItem(KEPT) || 'null');
    return kept && crypto.subtle.importKey('jwk', kept, 'AES-GCM', true, ['decrypt']);
  } catch { return null; }
}

(async () => {
  const key = await keptKey();
  if (!key) return;
  say('Opening…');
  try {
    const page = await unlock(await lockedKit(), key);
    if (page) return show(page, key);
  } catch {  }
  say('');
})();

document.getElementById('door').addEventListener('submit', async event => {
  event.preventDefault();
  say('Opening…');
  try {
    const bytes = await lockedKit();
    const key = await keyFrom(document.getElementById('password').value, bytes.slice(0, 16));
    const page = await unlock(bytes, key);
    if (!page) return say('Wrong password.', true);
    try {
      if (document.getElementById('remember').checked) localStorage.setItem(KEPT, JSON.stringify(await crypto.subtle.exportKey('jwk', key)));
      else localStorage.removeItem(KEPT);
    } catch {  }
    show(page, key);
  } catch {
    say('No signal, or the kit is not published yet. Try again in a moment.', true);
  }
});
</script>
</body>
</html>
